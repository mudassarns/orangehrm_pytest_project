[pytest]
# Show logs during test execution
log_cli = true
log_cli_level = INFO

log_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Retry failed tests once
reruns = 1
reruns_delay = 1

addopts = --html=reports/test-report.html --self-contained-html

markers =
    api: API tests
    ui: UI tests
    hybrid: UI and API integration tests
