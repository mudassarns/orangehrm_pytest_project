steps:
  - label: "Install Python dependencies"
    command: |
      sudo apt-get update -y
      sudo apt-get install -y libmariadb-dev python3.10-dev
      python3 --version
      python3 -m pip install -r requirements.txt

  - label: "Start Docker Stack"
    secrets:
      - QA_DB_PASSWORD
      - QA_DB_NAME
      - QA_DB_USER
    command: |
      MARIADB_ROOT_PASSWORD="$QA_DB_PASSWORD" \
      MARIADB_DATABASE="$QA_DB_NAME" \
      MARIADB_USER="$QA_DB_USER" \
      MARIADB_PASSWORD="$QA_DB_PASSWORD" \
      docker compose -f docker-orangehrm/docker-compose.yml up -d

      docker compose -f docker-orangehrm/docker-compose.yml ps
      