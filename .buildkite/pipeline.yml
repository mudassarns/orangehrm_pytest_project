steps:
  - label: "Install Python dependencies"
    command: |
      sudo apt-get update -y
      sudo apt-get install -y libmariadb-dev python3.10-dev
      python3 --version
      python3 -m pip install -r requirements.txt

  - label: "Start Docker Stack"
    secrets:
      - QA_DB_PASSWORD
      - QA_DB_NAME
      - QA_DB_USER
    command: |
      export MARIADB_ROOT_PASSWORD="$$QA_DB_PASSWORD"
      export MARIADB_DATABASE="$$QA_DB_NAME"
      export MARIADB_USER="orangehrm"
      export MARIADB_PASSWORD="$$QA_DB_PASSWORD"

      test -n "$$MARIADB_ROOT_PASSWORD" && echo "MARIADB_ROOT_PASSWORD is set"
      test -n "$$MARIADB_DATABASE" && echo "MARIADB_DATABASE is set"
      test -n "$$MARIADB_USER" && echo "MARIADB_USER is set"
      test -n "$$MARIADB_PASSWORD" && echo "MARIADB_PASSWORD is set"

      docker compose -f docker-orangehrm/docker-compose.yml up -d

      CONTAINER_ID=$(docker ps -q -f "name=mariadb")

      timeout 60s bash -c "
        until docker exec $CONTAINER_ID mariadb-admin ping -h 127.0.0.1 -u root -p\"$$QA_DB_PASSWORD\" --silent 2>/dev/null; do
          echo 'Waiting for MariaDB...'
          sleep 2
        done
      "

      echo "MariaDB is ready"

      docker compose -f docker-orangehrm/docker-compose.yml ps
      