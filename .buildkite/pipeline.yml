steps:
  - label: "Start Docker Stack"
    secrets:
      - QA_DB_PASSWORD
      - QA_DB_NAME
      - QA_DB_USER
      - QA_ORANGEHRM_USERNAME
      - QA_ORANGEHRM_PASSWORD
      - QA_ORANGEHRM_BASE_URL
      - QA_DB_HOST
      - QA_DB_PORT
    command: |
      sudo apt-get update -y
      sudo apt-get install -y libmariadb-dev python3.10-dev
      python3 --version

      export MARIADB_ROOT_PASSWORD="$$QA_DB_PASSWORD"
      export MARIADB_DATABASE=""
      export MARIADB_USER="orangehrm"
      export MARIADB_PASSWORD="$$QA_DB_PASSWORD"

      test -n "$$MARIADB_ROOT_PASSWORD" && echo "MARIADB_ROOT_PASSWORD is set"
      test -n "$$MARIADB_DATABASE" && echo "MARIADB_DATABASE is set"
      test -n "$$MARIADB_USER" && echo "MARIADB_USER is set"
      test -n "$$MARIADB_PASSWORD" && echo "MARIADB_PASSWORD is set"

      docker compose -f docker-orangehrm/docker-compose.v2.yml up -d --wait

      echo "MariaDB is ready"

      docker compose -f docker-orangehrm/docker-compose.v2.yml ps

      docker compose -f docker-orangehrm/docker-compose.v2.yml exec -T \
        -e CI_DB_HOST=mariadb \
        -e CI_DB_PORT=3306 \
        -e CI_DB_NAME="$$QA_DB_NAME" \
        -e CI_DB_PASSWORD="$$QA_DB_PASSWORD" \
        -e CI_ADMIN_USERNAME="$$QA_ORANGEHRM_USERNAME" \
        -e CI_ADMIN_PASSWORD="$$QA_ORANGEHRM_PASSWORD" \
        orangehrm php -r '
          require "/var/www/html/src/vendor/autoload.php";
          $$config = [
            "database" => [
              "hostName" => getenv("CI_DB_HOST"),
              "hostPort" => 3306,
              "databaseName" => getenv("CI_DB_NAME"),
              "privilegedDatabaseUser" => "root",
              "privilegedDatabasePassword" => getenv("CI_DB_PASSWORD"),
              "useSameDbUserForOrangeHRM" => "y",
              "orangehrmDatabaseUser" => null,
              "orangehrmDatabasePassword" => null,
              "isExistingDatabase" => "n",
              "enableDataEncryption" => "n"
            ],
            "organization" => [
              "name" => "Automation CI",
              "country" => "US"
            ],
            "admin" => [
              "adminUserName" => getenv("CI_ADMIN_USERNAME"),
              "adminPassword" => getenv("CI_ADMIN_PASSWORD"),
              "adminEmployeeFirstName" => "Automation",
              "adminEmployeeLastName" => "Admin",
              "workEmail" => "automation@example.com",
              "contactNumber" => null,
              "registrationConsent" => false
            ],
            "license" => ["agree" => "y"]
          ];
          file_put_contents(
            "/var/www/html/installer/cli_install_config.yaml",
            Symfony\Component\Yaml\Yaml::dump($$config, 4, 2)
          );
        '

      docker compose -f docker-orangehrm/docker-compose.v2.yml exec -T \
        orangehrm php /var/www/html/installer/cli_install.php

      echo "Checking OrangeHRM database tables..."
      docker compose -f docker-orangehrm/docker-compose.v2.yml exec -T mariadb \
        mariadb -u root -p"$$QA_DB_PASSWORD" "$$QA_DB_NAME" \
        -e "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema='$$QA_DB_NAME';"

      echo "Checking OrangeHRM login endpoint..."
      HTTP_STATUS=$$(curl -o /dev/null -s -w "%{http_code}" "http://localhost:8080/web/index.php/auth/login")
      echo "Login endpoint HTTP status: $$HTTP_STATUS"

      if [ "$$HTTP_STATUS" -ne 200 ]; then
        echo "=== ORANGEHRM CONTAINER LOGS ==="
        docker compose -f docker-orangehrm/docker-compose.v2.yml logs --tail=200 orangehrm || true
        exit 1
      fi

      echo "Installing Python dependencies..."
      python3 -m pip install --upgrade pip
      python3 -m pip install -r requirements.txt

      echo "Installing browser dependencies..."
      sudo apt-get update -y
      sudo apt-get install -y \
        libnss3 \
        libatk-bridge2.0-0 \
        libgtk-3-0 \
        libgbm1 \
        libasound2 \
        libxss1 \
        libxshmfence1

      echo "Running one UI test..."
      pytest tests/test_ui.py::test_orangehrm_login --headless -v -s
      