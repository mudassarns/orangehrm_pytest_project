steps:
  - label: "Check Python 3.14.6"
    command: |
      docker run --rm python:3.14.6 python --version

steps:
  - label: "Install MariaDB build dependency"
    command: |
      sudo apt-get update -y
      sudo apt-get install -y libmariadb-dev

  - label: "Install Python dependencies"
    command: |
      python3 --version
      python3 -m pip install -r requirements.txt