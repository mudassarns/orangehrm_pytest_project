name: OrangeHRM Automation CI

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install system dependencies for MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Start Docker Stack for CI
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: ${{ secrets.QA_DB_USER }}
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml up -d

      - name: Wait for MariaDB to be ready
        run: |
          timeout 60s bash -c '
            CONTAINER_ID=$(docker ps -q -f "ancestor=mariadb:11")
            if [ -z "$CONTAINER_ID" ]; then
              CONTAINER_ID=$(docker ps -q -f "name=mariadb")
            fi
            until docker exec $CONTAINER_ID mariadb-admin ping -h 127.0.0.1 -u root -p"${{ secrets.QA_DB_PASSWORD }}" --silent; do
              echo "Waiting for MariaDB..."
              sleep 2
            done
          '

      - name: Wait for OrangeHRM web service
        run: |
          timeout 120s bash -c '
            until curl -s http://localhost:8080 > /dev/null
            do
              echo "Waiting for OrangeHRM web service..."
              sleep 5
            done
          '

      - name: Install OrangeHRM via Container CLI
        env:
          DB_HOST: mariadb
          DB_PORT: "3306"
          DB_NAME: ${{ secrets.QA_DB_NAME }}
          DB_USER: root
          DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.QA_ORANGEHRM_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.QA_ORANGEHRM_PASSWORD }}
        run: |
          echo "Running OrangeHRM installation inside container via CLI..."
          
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm \
            php /var/www/html/symfony orangehrm:install \
            --db-host="$DB_HOST" \
            --db-port="$DB_PORT" \
            --db-name="$DB_NAME" \
            --db-user="$DB_USER" \
            --db-password="$DB_PASSWORD" \
            --admin-username="$ADMIN_USERNAME" \
            --admin-password="$ADMIN_PASSWORD"

      - name: Verify OrangeHRM installation status
        run: |
          echo "Verifying HTTP response code from Login page..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "http://localhost:8080/web/index.php/auth/login")
          echo "Login endpoint HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Installation verification failed!"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        env:
          QA_ORANGEHRM_BASE_URL: ${{ secrets.QA_ORANGEHRM_BASE_URL }}
          QA_ORANGEHRM_USERNAME: ${{ secrets.QA_ORANGEHRM_USERNAME }}
          QA_ORANGEHRM_PASSWORD: ${{ secrets.QA_ORANGEHRM_PASSWORD }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_PORT: ${{ secrets.QA_DB_PORT }}
          QA_DB_NAME: ${{ secrets.QA_DB_NAME }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          pytest --browser chrome --headless -v

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            screenshots/
          retention-days: 7

      - name: Tear down Docker Stack
        if: always()
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: ${{ secrets.QA_DB_USER }}
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml down -v