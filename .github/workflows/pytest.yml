name: OrangeHRM Automation CI

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install system dependencies for MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Start Docker Stack for CI
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ""
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml up -d

      - name: Wait for MariaDB to be ready
        run: |
          CONTAINER_ID=$(docker ps -q -f "name=mariadb")
          timeout 60s bash -c "
            until docker exec $CONTAINER_ID mariadb-admin ping -h 127.0.0.1 -u root -p\"${{ secrets.QA_DB_PASSWORD }}\" --silent 2>/dev/null; do
              echo 'Waiting for MariaDB...'
              sleep 2
            done
          "

      - name: Install OrangeHRM via Installer Console
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          # 1. Clean DB state
          docker compose -f docker-orangehrm/docker-compose.yml exec -T mariadb mariadb -u root -p"${{ secrets.QA_DB_PASSWORD }}" -e "DROP DATABASE IF EXISTS \`${{ secrets.QA_DB_NAME }}\`;"

          # 2. Run installer completely non-interactively via arguments
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm php installer/console install:on-new-database \
            --no-interaction \
            --accept-license \
            --db-host=mariadb \
            --db-port=3306 \
            --db-name="${{ secrets.QA_DB_NAME }}" \
            --db-user=root \
            --db-password="${{ secrets.QA_DB_PASSWORD }}" \
            --admin-user="${{ secrets.QA_ORANGEHRM_USERNAME }}" \
            --admin-password="${{ secrets.QA_ORANGEHRM_PASSWORD }}" \
            --organization-name="MyCompany" \
            --country-code="US" || \
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm php installer/console install:on-new-database \
            -n \
            --db-host=mariadb \
            --db-port=3306 \
            --db-name="${{ secrets.QA_DB_NAME }}" \
            --db-user=root \
            --db-password="${{ secrets.QA_DB_PASSWORD }}" \
            --admin-user="${{ secrets.QA_ORANGEHRM_USERNAME }}" \
            --admin-password="${{ secrets.QA_ORANGEHRM_PASSWORD }}"

          # 3. Set required permissions
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm bash -c "
            chmod -R 777 /var/www/html/src/storage /var/www/html/lib/confs
          "

      - name: Verify OrangeHRM installation status
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          echo "Verifying HTTP response code from Login page..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "http://localhost:8080/web/index.php/auth/login")
          echo "Login endpoint HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Installation verification failed! Dumping container logs:"
            docker compose -f docker-orangehrm/docker-compose.yml logs orangehrm
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run single pytest verification
        env:
          QA_ORANGEHRM_BASE_URL: ${{ secrets.QA_ORANGEHRM_BASE_URL }}
          QA_ORANGEHRM_USERNAME: ${{ secrets.QA_ORANGEHRM_USERNAME }}
          QA_ORANGEHRM_PASSWORD: ${{ secrets.QA_ORANGEHRM_PASSWORD }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_PORT: ${{ secrets.QA_DB_PORT }}
          QA_DB_NAME: ${{ secrets.QA_DB_NAME }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          pytest tests/test_api.py::test_get_employees --browser chrome --headless -v -s -p no:rerunfailures

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            screenshots/
          retention-days: 7

      - name: Tear down Docker Stack
        if: always()
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml down -v