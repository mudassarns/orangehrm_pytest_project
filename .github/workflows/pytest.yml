name: OrangeHRM Automation CI

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install system dependencies for MariaDB
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Start Docker Stack for CI
        timeout-minutes: 5
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ""
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml up -d

      - name: Wait for MariaDB to be ready
        timeout-minutes: 2
        run: |
          CONTAINER_ID=$(docker ps -q -f "name=mariadb")
          timeout 60s bash -c "
            until docker exec $CONTAINER_ID mariadb-admin ping -h 127.0.0.1 -u root -p\"${{ secrets.QA_DB_PASSWORD }}\" --silent 2>/dev/null; do
              echo 'Waiting for MariaDB...'
              sleep 2
            done
          "

      - name: Bypass Installer via Direct SQL Restore
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          # 1. Clean and recreate database
          docker compose -f docker-orangehrm/docker-compose.yml exec -T mariadb mariadb -u root -p"${{ secrets.QA_DB_PASSWORD }}" -e "DROP DATABASE IF EXISTS \`${{ secrets.QA_DB_NAME }}\`; CREATE DATABASE \`${{ secrets.QA_DB_NAME }}\`;"

          # 2. Dynamically locate and import all SQL scripts found in the installer directory
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm bash -c '
            for sql_file in $(find /var/www/html/installer -name "*.sql" | sort -V); do
              echo "Importing $sql_file..."
              mariadb -h mariadb -u root -p"${MARIADB_ROOT_PASSWORD}" "${MARIADB_DATABASE}" < "$sql_file"
            done
          '

          # 3. Write Conf.php and setup storage directories + required encryption key
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm bash -c "
            mkdir -p /var/www/html/lib/confs /var/www/html/src/storage/cms /var/www/html/src/storage/logs /var/www/html/src/storage/key
            echo '<?php class Conf { public \$dbhost = \"mariadb\"; public \$dbport = \"3306\"; public \$dbname = \"${{ secrets.QA_DB_NAME }}\"; public \$dbuser = \"root\"; public \$dbpass = \"${{ secrets.QA_DB_PASSWORD }}\"; public \$version = \"5.9\"; }' > /var/www/html/lib/confs/Conf.php
            echo 'key_data' > /var/www/html/src/storage/key/crypt.key
            chmod -R 777 /var/www/html/lib/confs /var/www/html/src/storage
          "

          # 4. Clear cache directories
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm bash -c "
            rm -rf /var/www/html/src/storage/cms/* /var/www/html/src/storage/logs/* || true
            chmod -R 777 /var/www/html/src/storage
          "

      - name: Verify OrangeHRM installation status
        timeout-minutes: 2
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          echo "Verifying HTTP response code from Login page..."
          # Retry loop with a max 30-second window so transient startup delays don't hang or crash instantly
          HTTP_STATUS=0
          for i in {1..10}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "http://localhost:8080/web/index.php/auth/login" || echo "000")
            echo "Attempt $i: HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              break
            fi
            sleep 3
          done

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "=== APACHE ERROR LOGS ==="
            docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm cat /var/log/apache2/error.log || true
            exit 1
          fi

      - name: Install Python dependencies
        timeout-minutes: 3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run single pytest verification
        timeout-minutes: 5
        env:
          QA_ORANGEHRM_BASE_URL: ${{ secrets.QA_ORANGEHRM_BASE_URL }}
          QA_ORANGEHRM_USERNAME: ${{ secrets.QA_ORANGEHRM_USERNAME }}
          QA_ORANGEHRM_PASSWORD: ${{ secrets.QA_ORANGEHRM_PASSWORD }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_PORT: ${{ secrets.QA_DB_PORT }}
          QA_DB_NAME: ${{ secrets.QA_DB_NAME }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          pytest tests/test_api.py::test_get_employees --browser chrome --headless -v -s -p no:rerunfailures

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            screenshots/
          retention-days: 7

      - name: Tear down Docker Stack
        if: always()
        timeout-minutes: 2
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml down -v