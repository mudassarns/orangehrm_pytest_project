name: OrangeHRM Automation CI

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install system dependencies for MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Start Docker Stack for CI
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml up -d

      - name: Wait for MariaDB to be ready
        run: |
          CONTAINER_ID=$(docker ps -q -f "name=mariadb")
          timeout 60s bash -c "
            until docker exec $CONTAINER_ID mariadb-admin ping -h 127.0.0.1 -u root -p\"${{ secrets.QA_DB_PASSWORD }}\" --silent 2>/dev/null; do
              echo 'Waiting for MariaDB...'
              sleep 2
            done
          "

      - name: Install OrangeHRM via Direct Database Seeding
        run: |
          CONTAINER_ID=$(docker ps -q -f "name=mariadb")

          # 1. Seed base database schema directly into MariaDB
          docker exec -i $CONTAINER_ID mariadb -u root -p"${{ secrets.QA_DB_PASSWORD }}" ${{ secrets.QA_DB_NAME }} < docker-orangehrm/db/initial_schema.sql 2>/dev/null || true

          # 2. Write database configuration file directly to mark setup complete
          docker compose -f docker-orangehrm/docker-compose.yml exec -T orangehrm bash -c 'cat << "EOF" > config/database.yml
          db_host: mariadb
          db_port: 3306
          db_name: ${{ secrets.QA_DB_NAME }}
          db_user: root
          db_pass: ${{ secrets.QA_DB_PASSWORD }}
          EOF'

      - name: Verify OrangeHRM installation status
        run: |
          echo "Verifying HTTP response code from Login page..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "http://localhost:8080/web/index.php/auth/login")
          echo "Login endpoint HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Installation verification failed!"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run single pytest verification
        env:
          QA_ORANGEHRM_BASE_URL: ${{ secrets.QA_ORANGEHRM_BASE_URL }}
          QA_ORANGEHRM_USERNAME: ${{ secrets.QA_ORANGEHRM_USERNAME }}
          QA_ORANGEHRM_PASSWORD: ${{ secrets.QA_ORANGEHRM_PASSWORD }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_PORT: ${{ secrets.QA_DB_PORT }}
          QA_DB_NAME: ${{ secrets.QA_DB_NAME }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          pytest tests/test_api.py::test_get_employees --browser chrome --headless -v -s -p no:rerunfailures

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            screenshots/
          retention-days: 7

      - name: Tear down Docker Stack
        if: always()
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.QA_DB_NAME }}
          MARIADB_USER: "orangehrm"
          MARIADB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          docker compose -f docker-orangehrm/docker-compose.yml down -v