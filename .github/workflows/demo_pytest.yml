name: OrangeHRM-demo Regression Pipeline

on:
  push:
    branches:
      - demo

jobs:
  orangehrm_tests:
    name: Running OrangeHRM-demo Tests
    runs-on: ubuntu-latest

    env:
      QA_ORANGEHRM_BASE_URL: ${{ secrets.QA_ORANGEHRM_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install MariaDB build dependency
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libmariadb-dev

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Test with pytest
        run: pytest -v -s tests/test_ui.py::test_orangehrm_login --headless
        
      - name: Upload ChromeDriver logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromedriver-logs
          path: logs/
          retention-days: 7

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            reports/
            screenshots/
          retention-days: 7